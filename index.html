<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>في رحاب الذكر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* تعريف الخط المرفوع */
        @font-face {
            font-family: 'MilanDisplay';
            src: url('Milan Display Black Swashes.otf') format('opentype'); /* تأكد من وضع ملف الخط في نفس مجلد الموقع */
        }

        /* الألوان الجديدة: هادئة، متناسقة ومريحة جداً للعين */
        :root {
            --primary-green: #2d6a4f; /* أخضر هادئ ومريح */
            --primary-blue: #4a90e2;  /* أزرق سماوي ناعم */
            --gold-glow: #ffb703;     /* لمسة ذهبية دافئة */
            --bg-color: #f4f7f6;      /* خلفية فاتحة ومريحة */
            --text-dark: #2b2d42;     /* لون نص داكن مريح للقراءة */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'MilanDisplay', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* خلفية ناعمة ومريحة بتدرج انسيابي هادئ */
            background: linear-gradient(135deg, #f4f7f6 0%, #e8f1ed 100%);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* تأثيرات خلفية ناعمة جداً بدلاً من الأشكال الحادة */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.4;
        }
        body::before {
            width: 300px;
            height: 300px;
            background: rgba(74, 144, 226, 0.15);
            top: 10%;
            left: -5%;
        }
        body::after {
            width: 350px;
            height: 350px;
            background: rgba(45, 106, 79, 0.12);
            bottom: 10%;
            right: -5%;
        }

        /* الهيدر واللوجو بتصميم متناسق وعصري */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            /* ظل ناعم وخفيف متناسق مع الألوان الجديدة */
            box-shadow: 0 10px 25px rgba(45, 106, 79, 0.1);
            border: 4px solid white;
            margin-bottom: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .logo:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(45, 106, 79, 0.15);
        }

        h1 {
            font-size: 2.2rem;
            color: var(--primary-green);
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .slogan {
            font-size: 1.1rem;
            color: #6c757d;
            font-weight: 500;
        }

        /* قسم العبارات الدينية بتصميم البطاقات العائمة الحديثة Clean UI */
        .content-section {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            /* ظل ناعم جداً واحترافي يمنح راحة بصرية كاملة */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04);
            border: 1px solid #eef2f1;
            margin-bottom: 25px;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .content-section:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        }

        .quote-box {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            line-height: 1.8;
            color: var(--text-dark);
            margin-bottom: 25px;
            padding: 20px;
            border-right: 4px solid var(--primary-green);
            border-left: 4px solid var(--primary-blue);
            background: #f8faf9;
            border-radius: 16px;
            transition: opacity 0.2s ease-in-out;
        }

        .quote-box i {
            color: var(--primary-green);
            margin-left: 12px;
            font-size: 1.3rem;
        }

        /* حاوية الأزرار التفاعلية */
        .action-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        .next-btn {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(45, 106, 79, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .next-btn i {
            font-size: 0.95rem;
            color: var(--gold-glow);
        }

        .next-btn:hover {
            background: #22513c;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(45, 106, 79, 0.25);
        }

        .next-btn:active {
            transform: translateY(0);
        }

        /* زر النسخ بتصميم دائري متناسق */
        .copy-btn {
            background: #ffffff;
            color: #6c757d;
            border: 1px solid #e2e8f0;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: #f8faf9;
            border-color: var(--primary-blue);
            color: var(--primary-blue);
            transform: translateY(-2px);
        }

        /* رسالة التنبيه عند النسخ */
        .toast {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(43, 45, 66, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* قسم قنوات الدعم والمساهمة الفلات الأنيق */
        .support-section {
            width: 100%;
            max-width: 480px;
            text-align: center;
            background: #ffffff;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04);
            border: 1px solid #eef2f1;
        }

        .support-title {
            font-size: 1rem;
            margin-bottom: 20px;
            color: #4a4a4a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
        }

        .support-title i {
            color: var(--primary-blue);
        }

        .buttons-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .pay-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1;
            min-width: 160px;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #ffffff;
        }

        .pay-btn.instapay .btn-logo {
            height: 20px;
            object-fit: contain;
        }

        .pay-btn.vodafone .btn-logo {
            height: 22px;
            object-fit: contain;
        }

        .pay-btn.instapay:hover {
            border-color: #673AB7;
            background: #fcfaff;
            color: #673AB7;
            transform: translateY(-2px);
        }

        .pay-btn.vodafone:hover {
            border-color: #E60000;
            background: #fffafa;
            color: #E60000;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header>
        <img src="https://i.postimg.cc/vxFdCjHJ/file-1781392254082.png" alt="لوجو في رحاب الذكر" class="logo">
        <h1>في رِحَابِ الذِّكْرِ</h1>
        <p class="slogan">"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ"</p>
    </header>

    <main class="content-section">
        <div class="toast" id="copy-toast"><i class="fa-solid fa-check"></i> تم نسخ الذكر بمحبة</div>
        
        <div class="quote-box" id="quote-container">
            <i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل الذكر الحكيم...
        </div>
        
        <div class="action-container">
            <button class="next-btn" onclick="getNewQuote()">
                <span>عبارة أخرى</span> 
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
            <button class="copy-btn" onclick="copyCurrentQuote()" title="نسخ العبارة لنشرها">
                <i class="fa-regular fa-copy"></i>
            </button>
        </div>
    </main>

    <section class="support-section">
        <p class="support-title"><i class="fa-solid fa-heart-rose"></i> للمساهمة في دعم مكتب تحفيظ القرآن الكريم بلمسة واحدة:</p>
        <div class="buttons-container">
            <a href="https://instapay.me/YOUR_USERNAME" target="_blank" class="pay-btn instapay">
                <img src="https://i.postimg.cc/hfV3Cvmt/GKV136-Insta-Pay-logobase-net.png" alt="InstaPay" class="btn-logo">
                <span>InstaPay</span>
            </a>
            <a href="tel:*9*7*رقم_المحفظة*القيمة_هنا#" class="pay-btn vodafone">
                <img src="https://i.postimg.cc/2qgQRFpP/etisalat-new-2022-seeklogo-(1).png" alt="Etisalat Cash" class="btn-logo">
                <span>اتصالات كاش</span>
            </a>
        </div>
    </section>

    <script>
        // قائمة العبارات الإيمانية والقرآنية الصافية والمعدة للأيقونات البرمجية
        const quotes = [
            "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ.",
            "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.",
            "وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ.",
            "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ العَلِيِّ العَظِيمِ؛ كَنْزٌ مِنْ كُنُوزِ الجَنَّةِ.",
            "أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ.",
            "اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى نَبِيِّنَا مُحَمَّدٍ."
        ];

        let currentQuoteText = "";

        function getNewQuote() {
            const container = document.getElementById('quote-container');
            // اختيار عبارة عشوائية من القائمة
            const randomIndex = Math.floor(Math.random() * quotes.length);
            currentQuoteText = quotes[randomIndex];
            
            // إضافة تأثير خفيف عند التغيير
            container.style.opacity = 0;
            setTimeout(() => {
                // دمج أيقونة المصحف الشريف الديناميكية برمجياً بدلاً من الإيموجي التقليدي
                container.innerHTML = `<i class="fa-solid fa-book-quran"></i> <span>${currentQuoteText}</span>`;
                container.style.opacity = 1;
            }, 150);
        }

        // دالة مزودة وجديدة لنسخ النص الحالي ومشاركته على فيسبوك وإنستجرام
        function copyCurrentQuote() {
            if(!currentQuoteText) return;
            navigator.clipboard.writeText(currentQuoteText).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.style.opacity = 1;
                setTimeout(() => {
                    toast.style.opacity = 0;
                }, 1800);
            });
        }

        // تشغيل أول عبارة تلقائياً عند فتح الموقع
        window.onload = getNewQuote;
    </script>
</body>
</html>
