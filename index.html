<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>في رحاب الذكر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* تعريف الخط المرفوع */
        @font-face {
            font-family: 'MilanDisplay';
            src: url('Milan Display Black Swashes.otf') format('opentype'); /* تأكد من وضع ملف الخط في نفس مجلد الموقع */
        }

        /* الألوان الأساسية التي اتفقنا عليها */
        :root {
            --primary-green: #4CAF50;
            --primary-blue: #2196F3;
            --bg-color: #F5F5F5;
            --text-dark: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'MilanDisplay', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* الهيدر واللوجو */
        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-in;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2rem;
            color: var(--primary-green);
            margin-bottom: 5px;
        }

        .slogan {
            font-size: 1.1rem;
            color: var(--primary-blue);
            font-style: italic;
        }

        /* قسم العبارات الدينية (البوسترات الرقمية) */
        .content-section {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            position: relative;
        }

        .quote-box {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            line-height: 1.8;
            color: #444;
            margin-bottom: 20px;
            padding: 10px 20px;
            border-right: 4px solid var(--primary-blue);
            border-left: 4px solid var(--primary-green);
            background: #fafafa;
            border-radius: 8px;
            transition: opacity 0.15s ease-in-out;
        }

        .quote-box i {
            color: var(--primary-green);
            margin-left: 10px;
            font-size: 1.2rem;
        }

        /* حاوية الأزرار التفاعلية للعبارات */
        .action-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .next-btn {
            background: linear-gradient(45deg, var(--primary-blue), var(--primary-green));
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .next-btn i {
            font-size: 0.9rem;
            animation: rotateSparkle 3s infinite linear;
        }

        .next-btn:active {
            transform: scale(0.95);
        }

        /* زر النسخ الجديد والمزود لتسهيل مشاركة البوسترات */
        .copy-btn {
            background: #f0f0f0;
            color: #555;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: #e0e0e0;
            color: var(--primary-blue);
        }

        .copy-btn:active {
            transform: scale(0.9);
        }

        /* رسالة منبثقة صغيرة لتم النسخ */
        .toast {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 10;
        }

        /* قسم قنوات الدعم والاتصال الصامتة للمكتب */
        .support-section {
            width: 100%;
            max-width: 500px;
            text-align: center;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .support-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .support-title i {
            color: var(--primary-blue);
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .pay-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1;
            min-width: 160px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .pay-btn i {
            font-size: 1.1rem;
        }

        .pay-btn.instapay:hover {
            border-color: #673AB7;
            background-color: #f7f3ff;
            color: #673AB7;
        }

        .pay-btn.vodafone:hover {
            border-color: #E60000;
            background-color: #fff5f5;
            color: #E60000;
        }

        .pay-btn img {
            height: 24px;
            object-fit: contain;
        }

        /* أنيميشن خفيف */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes rotateSparkle {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <img src="https://i.postimg.cc/vxFdCjHJ/file-1781392254082.png" alt="لوجو في رحاب الذكر" class="logo">
        <h1>في رِحَابِ الذِّكْرِ</h1>
        <p class="slogan">"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ"</p>
    </header>

    <main class="content-section">
        <div class="toast" id="copy-toast"><i class="fa-solid fa-check"></i> تم نسخ الذكر بمحبة</div>
        
        <div class="quote-box" id="quote-container">
            <i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل الذكر الحكيم...
        </div>
        
        <div class="action-container">
            <button class="next-btn" onclick="getNewQuote()">
                <span>عبارة أخرى</span> 
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
            <button class="copy-btn" onclick="copyCurrentQuote()" title="نسخ العبارة لنشرها">
                <i class="fa-regular fa-copy"></i>
            </button>
        </div>
    </main>

    <section class="support-section">
        <p class="support-title"><i class="fa-solid fa-heart-rose"></i> للمساهمة في دعم مكتب تحفيظ القرآن الكريم بلمسة واحدة:</p>
        <div class="buttons-container">
            <a href="https://instapay.me/YOUR_USERNAME" target="_blank" class="pay-btn instapay">
                <i class="fa-solid fa-money-bill-transfer"></i>
                <span>InstaPay</span>
            </a>
            <a href="tel:*9*7*رقم_المحفظة*القيمة_هنا#" class="pay-btn vodafone">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span>اتصالات كاش</span>
            </a>
        </div>
    </section>

    <script>
        // قائمة العبارات الإيمانية والقرآنية الصافية والمعدة للأيقونات البرمجية
        const quotes = [
            "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ.",
            "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.",
            "وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ.",
            "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ العَلِيِّ العَظِيمِ؛ كَنْزٌ مِنْ كُنُوزِ الجَنَّةِ.",
            "أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ.",
            "اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى نَبِيِّنَا مُحَمَّدٍ."
        ];

        let currentQuoteText = "";

        function getNewQuote() {
            const container = document.getElementById('quote-container');
            // اختيار عبارة عشوائية من القائمة
            const randomIndex = Math.floor(Math.random() * quotes.length);
            currentQuoteText = quotes[randomIndex];
            
            // إضافة تأثير خفيف عند التغيير
            container.style.opacity = 0;
            setTimeout(() => {
                // دمج أيقونة المصحف الشريف الديناميكية برمجياً بدلاً من الإيموجي التقليدي
                container.innerHTML = `<i class="fa-solid fa-book-quran"></i> <span>${currentQuoteText}</span>`;
                container.style.opacity = 1;
            }, 150);
        }

        // دالة مزودة وجديدة لنسخ النص الحالي ومشاركته على فيسبوك وإنستجرام
        function copyCurrentQuote() {
            if(!currentQuoteText) return;
            navigator.clipboard.writeText(currentQuoteText).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.style.opacity = 1;
                setTimeout(() => {
                    toast.style.opacity = 0;
                }, 1800);
            });
        }

        // تشغيل أول عبارة تلقائياً عند فتح الموقع
        window.onload = getNewQuote;
    </script>
</body>
</html>
