<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>في رحاب الذكر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* تعريف الخط المرفوع */
        @font-face {
            font-family: 'MilanDisplay';
            src: url('Milan Display Black Swashes.otf') format('opentype'); /* تأكد من وضع ملف الخط في نفس مجلد الموقع */
        }

        /* الألوان الأساسية التي اتفقنا عليها */
        :root {
            --primary-green: #4CAF50;
            --primary-blue: #2196F3;
            --bg-color: #F5F5F5;
            --text-dark: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'MilanDisplay', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* خلفية ثلاثية الأبعاد جبارة وروحانية عميقة */
            background: radial-gradient(circle at 50% 15%, #ffffff 0%, #edf5ff 40%, #e2f3e4 80%, #d4ebd6 100%);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            perspective: 1000px; /* تمكين المنظور ثلاثي الأبعاد للموقع */
        }

        /* عناصر الخلفية ثلاثية الأبعاد الجبارة (Floating Orbs) */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            opacity: 0.6;
            animation: float3D 12s infinite alternate ease-in-out;
        }
        body::before {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(33,150,243,0.3) 0%, rgba(33,150,243,0) 70%);
            top: 10%;
            left: -5%;
        }
        body::after {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(76,175,80,0.25) 0%, rgba(76,175,80,0) 70%);
            bottom: 10%;
            right: -5%;
            animation-delay: -4s;
        }

        /* الهيدر واللوجو */
        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn3D 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
        }

        .logo {
            width: 125px;
            height: 125px;
            object-fit: cover;
            border-radius: 50%;
            /* تأثير ظل ثلاثي الأبعاد بارز وعميق للمجسمات الدائرية */
            box-shadow: 0 15px 35px rgba(33, 150, 243, 0.25), inset 0 -4px 10px rgba(0,0,0,0.05);
            border: 4px solid white;
            margin-bottom: 15px;
            transition: transform 0.4s ease;
            transform: translateZ(30px);
        }
        
        .logo:hover {
            transform: scale(1.05) rotate(5deg) translateZ(40px);
        }

        h1 {
            font-size: 2.4rem;
            color: var(--primary-green);
            margin-bottom: 5px;
            text-shadow: 0 4px 10px rgba(76, 175, 80, 0.15), 0 2px 3px rgba(0,0,0,0.05);
            letter-spacing: 0.5px;
        }

        .slogan {
            font-size: 1.15rem;
            color: var(--primary-blue);
            font-style: italic;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(33, 150, 243, 0.1);
        }

        /* قسم العبارات الدينية (البوسترات الرقمية 3D) */
        .content-section {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 28px;
            padding: 35px 30px;
            text-align: center;
            /* ظل مركب يعطي إحساساً حقيقياً بالطوفان ثلاثي الأبعاد */
            box-shadow: 0 30px 60px rgba(0,0,0,0.06), 0 10px 20px rgba(0,0,0,0.02), inset 0 1px 0 rgba(255,255,255,0.6);
            margin-bottom: 30px;
            position: relative;
            transform-style: preserve-3d;
            transform: translateZ(0deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideUp3D 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .content-section:hover {
            transform: translateY(-5px) rotateX(2deg) rotateY(-1deg);
            box-shadow: 0 40px 75px rgba(0,0,0,0.08), 0 15px 25px rgba(0,0,0,0.03);
        }

        .quote-box {
            min-height: 135px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            line-height: 1.8;
            color: #2c2c2c;
            margin-bottom: 25px;
            padding: 18px 22px;
            border-right: 5px solid var(--primary-blue);
            border-left: 5px solid var(--primary-green);
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(245,250,246,0.6));
            border-radius: 18px;
            transition: opacity 0.15s ease-in-out;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.02), 0 4px 12px rgba(0,0,0,0.01);
            transform: translateZ(15px);
        }

        .quote-box i {
            color: var(--primary-green);
            margin-left: 14px;
            font-size: 1.4rem;
            text-shadow: 0 2px 4px rgba(76,175,80,0.2);
        }

        /* حاوية الأزرار التفاعلية للعبارات */
        .action-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            transform: translateZ(20px);
        }

        .next-btn {
            background: linear-gradient(45deg, #1e88e5, #43a047);
            color: white;
            border: none;
            padding: 14px 38px;
            font-size: 1.05rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            /* زاوية ظل واضحة تمنح تأثيراً مجسماً بارزاً للأزرار */
            box-shadow: 0 8px 25px rgba(67, 160, 71, 0.3), 0 4px 10px rgba(0,0,0,0.05);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .next-btn i {
            font-size: 1rem;
            animation: rotateSparkle 3s infinite linear;
        }

        .next-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(67, 160, 71, 0.4), 0 5px 15px rgba(0,0,0,0.08);
            background: linear-gradient(45deg, #2196F3, #4CAF50);
        }

        .next-btn:active {
            transform: scale(0.96) translateY(-1px);
            box-shadow: 0 5px 15px rgba(67, 160, 71, 0.2);
        }

        /* زر النسخ الجديد والمزود لتسهيل مشاركة البوسترات */
        .copy-btn {
            background: #ffffff;
            color: #555;
            border: 1px solid #e2e8f0;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 6px 15px rgba(0,0,0,0.03);
        }

        .copy-btn:hover {
            background: white;
            border-color: var(--primary-blue);
            color: var(--primary-blue);
            box-shadow: 0 10px 20px rgba(33, 150, 243, 0.18);
            transform: translateY(-3px);
        }

        .copy-btn:active {
            transform: scale(0.92) translateY(-1px);
        }

        /* رسالة منبثقة صغيرة لتم النسخ */
        .toast {
            position: absolute;
            bottom: 105px;
            left: 50%;
            transform: translateX(-50%) translateZ(25px);
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: white;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            font-weight: 500;
        }

        /* قسم قنوات الدعم والاتصال الصامتة للمكتب */
        .support-section {
            width: 100%;
            max-width: 500px;
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 28px;
            padding: 25px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.06), 0 10px 20px rgba(0,0,0,0.02);
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
            animation: slideUp3D 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .support-section:hover {
            transform: translateY(-3px) rotateX(1.5deg);
        }

        .support-title {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #4a4a4a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
            transform: translateZ(10px);
        }

        .support-title i {
            color: var(--primary-blue);
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            transform: translateZ(15px);
        }

        .pay-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex: 1;
            min-width: 165px;
            padding: 14px;
            border: 2px solid #edf2f7;
            border-radius: 18px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: #ffffff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }

        /* تخصيص زر انستا باي باللوجو الرسمي */
        .pay-btn.instapay .btn-logo {
            height: 22px;
            object-fit: contain;
        }

        /* تخصيص زر اتصالات كاش باللوجو الرسمي */
        .pay-btn.vodafone .btn-logo {
            height: 24px;
            object-fit: contain;
        }

        .pay-btn.instapay:hover {
            border-color: #673AB7;
            background-color: #ffffff;
            color: #673AB7;
            box-shadow: 0 10px 25px rgba(103, 58, 183, 0.15);
            transform: translateY(-3px) scale(1.02);
        }

        .pay-btn.vodafone:hover {
            border-color: #E60000;
            background-color: #ffffff;
            color: #E60000;
            box-shadow: 0 10px 25px rgba(230, 0, 0, 0.12);
            transform: translateY(-3px) scale(1.02);
        }
        
        .pay-btn:active {
            transform: scale(0.97) translateY(-1px);
        }

        /* أنيميشن الحركات والظهور المجسم للموقع */
        @keyframes fadeIn3D {
            from { opacity: 0; transform: translateY(-20px) translateZ(-50px); }
            to { opacity: 1; transform: translateY(0) translateZ(0); }
        }

        @keyframes slideUp3D {
            from { opacity: 0; transform: translateY(30px) rotateX(-5deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        @keyframes float3D {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            100% { transform: translateY(-20px) scale(1.05) rotate(10deg); }
        }

        @keyframes rotateSparkle {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <img src="https://i.postimg.cc/vxFdCjHJ/file-1781392254082.png" alt="لوجو في رحاب الذكر" class="logo">
        <h1>في رِحَابِ الذِّكْرِ</h1>
        <p class="slogan">"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ"</p>
    </header>

    <main class="content-section">
        <div class="toast" id="copy-toast"><i class="fa-solid fa-check"></i> تم نسخ الذكر بمحبة</div>
        
        <div class="quote-box" id="quote-container">
            <i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل الذكر الحكيم...
        </div>
        
        <div class="action-container">
            <button class="next-btn" onclick="getNewQuote()">
                <span>عبارة أخرى</span> 
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
            <button class="copy-btn" onclick="copyCurrentQuote()" title="نسخ العبارة لنشرها">
                <i class="fa-regular fa-copy"></i>
            </button>
        </div>
    </main>

    <section class="support-section">
        <p class="support-title"><i class="fa-solid fa-heart-rose"></i> للمساهمة في دعم مكتب تحفيظ القرآن الكريم بلمسة واحدة:</p>
        <div class="buttons-container">
            <a href="https://instapay.me/YOUR_USERNAME" target="_blank" class="pay-btn instapay">
                <img src="https://i.postimg.cc/hfV3Cvmt/GKV136-Insta-Pay-logobase-net.png" alt="InstaPay" class="btn-logo">
                <span>InstaPay</span>
            </a>
            <a href="tel:*9*7*رقم_المحفظة*القيمة_هنا#" class="pay-btn vodafone">
                <img src="https://i.postimg.cc/2qgQRFpP/etisalat-new-2022-seeklogo-(1).png" alt="Etisalat Cash" class="btn-logo">
                <span>اتصالات كاش</span>
            </a>
        </div>
    </section>

    <script>
        // قائمة العبارات الإيمانية والقرآنية الصافية والمعدة للأيقونات البرمجية
        const quotes = [
            "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ.",
            "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.",
            "وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ.",
            "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ العَلِيِّ العَظِيمِ؛ كَنْزٌ مِنْ كُنُوزِ الجَنَّةِ.",
            "أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ.",
            "اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى نَبِيِّنَا مُحَمَّدٍ."
        ];

        let currentQuoteText = "";

        function getNewQuote() {
            const container = document.getElementById('quote-container');
            // اختيار عبارة عشوائية من القائمة
            const randomIndex = Math.floor(Math.random() * quotes.length);
            currentQuoteText = quotes[randomIndex];
            
            // إضافة تأثير خفيف عند التغيير
            container.style.opacity = 0;
            setTimeout(() => {
                // دمج أيقونة المصحف الشريف الديناميكية برمجياً بدلاً من الإيموجي التقليدي
                container.innerHTML = `<i class="fa-solid fa-book-quran"></i> <span>${currentQuoteText}</span>`;
                container.style.opacity = 1;
            }, 150);
        }

        // دالة مزودة وجديدة لنسخ النص الحالي ومشاركته على فيسبوك وإنستجرام
        function copyCurrentQuote() {
            if(!currentQuoteText) return;
            navigator.clipboard.writeText(currentQuoteText).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.style.opacity = 1;
                setTimeout(() => {
                    toast.style.opacity = 0;
                }, 1800);
            });
        }

        // تشغيل أول عبارة تلقائياً عند فتح الموقع
        window.onload = getNewQuote;
    </script>
</body>
</html>
