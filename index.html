<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>في رحاب الذكر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* تعريف الخط المرفوع */
        @font-face {
            font-family: 'MilanDisplay';
            src: url('Milan Display Black Swashes.otf') format('opentype'); /* تأكد من وضع ملف الخط في نفس مجلد الموقع */
        }

        /* الألوان الأساسية الفاخرة والأكثر احترافية */
        :root {
            --primary-green: #0d5c3a; /* أخضر زمردي فاخر ملكي */
            --primary-blue: #1565c0;  /* أزرق نيلي عميق احترافي */
            --gold-glow: #ffb300;     /* ذهبي مشع للتأثيرات الروحانية */
            --bg-color: #F5F5F5;
            --text-dark: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'MilanDisplay', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* خلفية ثلاثية الأبعاد جبارة وروحانية عميقة بنظام تدرج فاخر ومريح */
            background: radial-gradient(circle at 50% 10%, #ffffff 0%, #f0f7f4 35%, #e1eff2 70%, #d2e7df 100%);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 24px 20px;
            overflow-x: hidden;
            position: relative;
            perspective: 1200px; /* تعميق المنظور ثلاثي الأبعاد لجعل العناصر تطفو بوضوح */
        }

        /* عناصر الخلفية ثلاثية الأبعاد الجبارة (Floating Orbs) ألوان محسنة */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: float3D 15s infinite alternate ease-in-out;
        }
        body::before {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(21,101,192,0.25) 0%, rgba(21,101,192,0) 70%);
            top: 5%;
            left: -10%;
        }
        body::after {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(13,92,58,0.22) 0%, rgba(13,92,58,0) 70%);
            bottom: 5%;
            right: -10%;
            animation-delay: -5s;
        }

        /* الهيدر واللوجو */
        header {
            text-align: center;
            margin-bottom: 35px;
            animation: fadeIn3D 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
        }

        .logo {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            /* تأثير ظل بارز وعميق ثلاثي الأبعاد محاط ببريق ذهبي ناعم */
            box-shadow: 0 20px 40px rgba(13, 92, 58, 0.18), 0 5px 15px rgba(0,0,0,0.06), inset 0 -4px 10px rgba(0,0,0,0.03);
            border: 4px solid white;
            margin-bottom: 18px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateZ(40px);
        }
        
        .logo:hover {
            transform: scale(1.08) rotate(-3deg) translateZ(55px);
            box-shadow: 0 25px 45px rgba(21, 101, 192, 0.25);
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary-green);
            margin-bottom: 6px;
            text-shadow: 0 4px 12px rgba(13, 92, 58, 0.12), 0 2px 3px rgba(0,0,0,0.03);
            letter-spacing: 0.5px;
            font-weight: 800;
        }

        .slogan {
            font-size: 1.15rem;
            color: var(--primary-blue);
            font-style: italic;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(21, 101, 192, 0.08);
        }

        /* قسم العبارات الدينية (البوسترات الرقمية 3D الجبارة) */
        .content-section {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            padding: 40px 32px;
            text-align: center;
            /* ظل مركب احترافي يعطي إحساساً بالطوفان الحقيقي فوق الشاشة */
            box-shadow: 0 35px 70px rgba(13, 92, 58, 0.07), 0 15px 30px rgba(0,0,0,0.03), inset 0 1px 1px rgba(255,255,255,0.8);
            margin-bottom: 35px;
            position: relative;
            transform-style: preserve-3d;
            transform: translateZ(0px);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
            animation: slideUp3D 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .content-section:hover {
            transform: translateY(-8px) rotateX(2.5deg) rotateY(-1.5deg);
            box-shadow: 0 45px 85px rgba(13, 92, 58, 0.12), 0 20px 35px rgba(0,0,0,0.04);
            border-color: rgba(255, 255, 255, 0.95);
        }

        .quote-box {
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.55rem;
            line-height: 1.85;
            color: #1a1a1a;
            margin-bottom: 30px;
            padding: 20px 25px;
            border-right: 5px solid var(--primary-blue);
            border-left: 5px solid var(--primary-green);
            background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(243,249,246,0.7) 100%);
            border-radius: 20px;
            transition: opacity 0.18s ease-in-out;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.015), 0 5px 15px rgba(0,0,0,0.01);
            transform: translateZ(25px);
        }

        .quote-box i {
            color: var(--primary-green);
            margin-left: 14px;
            font-size: 1.5rem;
            text-shadow: 0 3px 6px rgba(13,92,58,0.15);
        }

        /* حاوية الأزرار التفاعلية للعبارات */
        .action-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            transform: translateZ(35px);
        }

        .next-btn {
            background: linear-gradient(135deg, var(--primary-blue), #1976d2, var(--primary-green));
            background-size: 150% 150%;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            /* زاوية ظل واضحة وعميقة تمنح الزر وزناً ومجسماً حقيقياً */
            box-shadow: 0 10px 28px rgba(21, 101, 192, 0.35), 0 4px 10px rgba(0,0,0,0.06);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .next-btn i {
            font-size: 1.05rem;
            color: var(--gold-glow);
            animation: rotateSparkle 3.5s infinite linear;
        }

        .next-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 14px 35px rgba(21, 101, 192, 0.45), 0 6px 18px rgba(0,0,0,0.08);
            background-position: right center;
        }

        .next-btn:active {
            transform: scale(0.96) translateY(-1px);
            box-shadow: 0 6px 18px rgba(21, 101, 192, 0.25);
        }

        /* زر النسخ الجديد والمزود لتسهيل مشاركة البوسترات */
        .copy-btn {
            background: #ffffff;
            color: #444;
            border: 1px solid #e2e8f0;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 6px 16px rgba(0,0,0,0.03);
        }

        .copy-btn:hover {
            background: white;
            border-color: var(--primary-blue);
            color: var(--primary-blue);
            box-shadow: 0 12px 24px rgba(21, 101, 192, 0.16);
            transform: translateY(-4px);
        }

        .copy-btn:active {
            transform: scale(0.92) translateY(-1px);
        }

        /* رسالة منبثقة صغيرة لتم النسخ */
        .toast {
            position: absolute;
            bottom: 115px;
            left: 50%;
            transform: translateX(-50%) translateZ(40px);
            background: rgba(13, 92, 58, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 12px 30px rgba(13,92,58,0.25);
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* قسم قنوات الدعم والاتصال الصامتة للمكتب */
        .support-section {
            width: 100%;
            max-width: 500px;
            text-align: center;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            padding: 28px;
            box-shadow: 0 35px 70px rgba(13, 92, 58, 0.05), 0 15px 30px rgba(0,0,0,0.02);
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: slideUp3D 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .support-section:hover {
            transform: translateY(-5px) rotateX(2deg);
            box-shadow: 0 40px 80px rgba(13, 92, 58, 0.08);
        }

        .support-title {
            font-size: 1.1rem;
            margin-bottom: 22px;
            color: #3a3a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
            transform: translateZ(15px);
        }

        .support-title i {
            color: var(--primary-blue);
        }

        .buttons-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            transform: translateZ(20px);
        }

        .pay-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex: 1;
            min-width: 170px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: #ffffff;
            box-shadow: 0 6px 12px rgba(0,0,0,0.01);
        }

        /* تخصيص زر انستا باي باللوجو الرسمي */
        .pay-btn.instapay .btn-logo {
            height: 24px;
            object-fit: contain;
        }

        /* تخصيص زر اتصالات كاش باللوجو الرسمي */
        .pay-btn.vodafone .btn-logo {
            height: 26px;
            object-fit: contain;
        }

        .pay-btn.instapay:hover {
            border-color: #673AB7;
            background-color: #ffffff;
            color: #673AB7;
            box-shadow: 0 12px 28px rgba(103, 58, 183, 0.16);
            transform: translateY(-4px) scale(1.02);
        }

        .pay-btn.vodafone:hover {
            border-color: #E60000;
            background-color: #ffffff;
            color: #E60000;
            box-shadow: 0 12px 28px rgba(230, 0, 0, 0.14);
            transform: translateY(-4px) scale(1.02);
        }
        
        .pay-btn:active {
            transform: scale(0.97) translateY(-1px);
        }

        /* أنيميشن الحركات والظهور المجسم الفاخر للموقع */
        @keyframes fadeIn3D {
            from { opacity: 0; transform: translateY(-25px) translateZ(-60px); }
            to { opacity: 1; transform: translateY(0) translateZ(0); }
        }

        @keyframes slideUp3D {
            from { opacity: 0; transform: translateY(40px) rotateX(-6deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        @keyframes float3D {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            100% { transform: translateY(-25px) scale(1.06) rotate(8deg); }
        }

        @keyframes rotateSparkle {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <img src="https://i.postimg.cc/vxFdCjHJ/file-1781392254082.png" alt="لوجو في رحاب الذكر" class="logo">
        <h1>في رِحَابِ الذِّكْرِ</h1>
        <p class="slogan">"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ"</p>
    </header>

    <main class="content-section">
        <div class="toast" id="copy-toast"><i class="fa-solid fa-check"></i> تم نسخ الذكر بمحبة</div>
        
        <div class="quote-box" id="quote-container">
            <i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل الذكر الحكيم...
        </div>
        
        <div class="action-container">
            <button class="next-btn" onclick="getNewQuote()">
                <span>عبارة أخرى</span> 
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
            <button class="copy-btn" onclick="copyCurrentQuote()" title="نسخ العبارة لنشرها">
                <i class="fa-regular fa-copy"></i>
            </button>
        </div>
    </main>

    <section class="support-section">
        <p class="support-title"><i class="fa-solid fa-heart-rose"></i> للمساهمة في دعم مكتب تحفيظ القرآن الكريم بلمسة واحدة:</p>
        <div class="buttons-container">
            <a href="https://instapay.me/YOUR_USERNAME" target="_blank" class="pay-btn instapay">
                <img src="https://i.postimg.cc/hfV3Cvmt/GKV136-Insta-Pay-logobase-net.png" alt="InstaPay" class="btn-logo">
                <span>InstaPay</span>
            </a>
            <a href="tel:*9*7*رقم_المحفظة*القيمة_هنا#" class="pay-btn vodafone">
                <img src="https://i.postimg.cc/2qgQRFpP/etisalat-new-2022-seeklogo-(1).png" alt="Etisalat Cash" class="btn-logo">
                <span>اتصالات كاش</span>
            </a>
        </div>
    </section>

    <script>
        // قائمة العبارات الإيمانية والقرآنية الصافية والمعدة للأيقونات البرمجية
        const quotes = [
            "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ.",
            "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.",
            "وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ.",
            "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ العَلِيِّ العَظِيمِ؛ كَنْزٌ مِنْ كُنُوزِ الجَنَّةِ.",
            "أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ.",
            "اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى نَبِيِّنَا مُحَمَّدٍ."
        ];

        let currentQuoteText = "";

        function getNewQuote() {
            const container = document.getElementById('quote-container');
            // اختيار عبارة عشوائية من القائمة
            const randomIndex = Math.floor(Math.random() * quotes.length);
            currentQuoteText = quotes[randomIndex];
            
            // إضافة تأثير خفيف عند التغيير
            container.style.opacity = 0;
            setTimeout(() => {
                // دمج أيقونة المصحف الشريف الديناميكية برمجياً بدلاً من الإيموجي التقليدي
                container.innerHTML = `<i class="fa-solid fa-book-quran"></i> <span>${currentQuoteText}</span>`;
                container.style.opacity = 1;
            }, 150);
        }

        // دالة مزودة وجديدة لنسخ النص الحالي ومشاركته على فيسبوك وإنستجرام
        function copyCurrentQuote() {
            if(!currentQuoteText) return;
            navigator.clipboard.writeText(currentQuoteText).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.style.opacity = 1;
                setTimeout(() => {
                    toast.style.opacity = 0;
                }, 1800);
            });
        }

        // تشغيل أول عبارة تلقائياً عند فتح الموقع
        window.onload = getNewQuote;
    </script>
</body>
</html>
